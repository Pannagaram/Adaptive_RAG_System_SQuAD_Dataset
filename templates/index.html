<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adaptive RAG Inference System">
    <title>Adaptive RAG</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>

<!-- Loading Overlay for initial startup -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Waking up RAG Pipeline...</div>
</div>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" title="Menu">
                <span class="material-icons">menu</span>
            </button>
            <span class="logo-text">Adaptive RAG</span>
        </div>
        
        <button class="new-chat-btn" onclick="startNewChat()">
            <span class="material-icons">add</span>
            New Chat
        </button>

        <div class="sidebar-section">
            <div class="sidebar-title">Recent</div>
            <div class="history-list" id="historyList">
                <!-- History items will be injected here -->
            </div>
        </div>
        
        <div class="sidebar-footer">
            <div class="model-info">
                <span>Built with ❤️ by Pannagaram</span>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content">
        <header class="top-nav">
            <div class="nav-model-selector">
                Adaptive RAG <span class="material-icons">arrow_drop_down</span>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="greeting">
                    <span class="greeting-gradient">Hello there.</span>
                    <br>
                    <span class="greeting-sub">How can I help you today?</span>
                </div>
            </div>
            
            <!-- Chat Messages will be appended here -->
            <div id="messagesContainer" class="messages-container"></div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="queryInput" 
                    placeholder="Enter a prompt here" 
                    rows="1"
                    spellcheck="false"
                ></textarea>
                <div class="input-actions">
                    <button class="send-btn" id="queryBtn" title="Send message">
                        <span class="material-icons">send</span>
                    </button>
                </div>
            </div>
            <div class="disclaimer">
                Adaptive RAG can make mistakes. Verify important information.
            </div>
        </div>
    </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
